const nodeW  = 700;
const nodeH  = 140;
const hGap   = 20;
const vGap   = 140;

const root = d3.hierarchy(data);
const layout = d3.tree()
	.nodeSize([nodeW + hGap, nodeH + vGap])
	.separation((a, b) => (a.parent === b.parent ? 1.0 : 1.4));
layout(root);

const svg = d3.select("#tree").append("svg")
	.attr("width", 1)
	.attr("height", 1);

const g = svg.append("g");

const linkGen = d3.linkVertical().x(d => d.x).y(d => d.y);
const link = g.selectAll("path.link")
	.data(root.links())
	.join("path")
	.attr("class", "link")
	.attr("d", linkGen);

const node = g.selectAll("g.node")
	.data(root.descendants())
	.join("g")
	.attr("transform", d => `translate(${d.x},${d.y})`);

node.append("rect")
	.attr("class", "node-box")
	.attr("x", -nodeW/2)
	.attr("y", 0)
	.attr("width", nodeW)
	.attr("height", nodeH);

node.append("foreignObject")
	.attr("class", "node-fo")
	.attr("x", -nodeW/2 + 6)
	.attr("y", 6)
	.attr("width", nodeW - 12)
	.attr("height", 1000)
	.html(d => nodeHTML(d.data));

node.selectAll("foreignObject").each(function(d) {
	const fo = d3.select(this);
	const div = fo.select("div").node();
	const h = div.getBoundingClientRect().height + 12;
	d._nodeHeight = h;
	fo.attr("height", h);
	d3.select(this.parentNode).select("rect").attr("height", h + 12);
});

const depthMaxHeight = new Map();
root.each(d => {
	const h = d._nodeHeight || nodeH;
	const existing = depthMaxHeight.get(d.depth) || 0;
	if (h > existing) { depthMaxHeight.set(d.depth, h); }
});

const depthOffsets = [];
const maxDepth = Math.max(...Array.from(depthMaxHeight.keys()));
for (let i = 0; i <= maxDepth; i++) {
	const prev = i === 0 ? 0 : depthOffsets[i - 1] + depthMaxHeight.get(i - 1) + vGap;
	depthOffsets.push(prev);
}

root.each(d => { d.y = depthOffsets[d.depth]; });

node.attr("transform", d => `translate(${d.x},${d.y})`);
link.attr("d", linkGen);

let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
root.each(d => {
	const halfW = nodeW / 2;
	const h = d._nodeHeight || nodeH;
	if (d.x - halfW - 30 < x0) x0 = d.x - halfW - 30;
	if (d.x + halfW + 30 > x1) x1 = d.x + halfW + 30;
	if (d.y - 30 < y0) y0 = d.y - 30;
	if (d.y + h + 30 > y1) y1 = d.y + h + 30;
});
const width  = x1 - x0;
const height = y1 - y0;

svg.attr("width", width)
	.attr("height", height)
	.attr("viewBox", [x0, y0, width, height].join(" "));

function subtable(title, rows) {
	if (!rows || rows.length === 0) return "";
	const body = rows.map(r =>
		`<tr><td>${r.attr}</td><td>${r.val}</td><td>${r.count}</td></tr>`
	).join("");
	return `<div class="sub-title">${title}</div>
		<table>
			<tr><th>Attr</th><th>Value</th><th>Count</th></tr>
			${body}
		</table>`;
}

function nodeHTML(d) {
	const hasLeft  = d.left_rows  && d.left_rows.length  > 0;
	const hasRight = d.right_rows && d.right_rows.length > 0;
	const hasOther = d.other_rows && d.other_rows.length > 0;
	const hasSplit = hasLeft || hasRight;

	let mainHTML = "";
	if (hasSplit) {
		// Determine section header label based on which sides are present
		const leftLabel  = hasLeft  ? (d.left_rows[0].attr.startsWith("Context")  ? "Before" : "Left")  : "Left";
		const rightLabel = hasRight ? (d.right_rows[0].attr.startsWith("Context") ? "After"  : "Right") : "Right";
		mainHTML = `<div class="section-header">Attributes</div>
			<div class="side-by-side">
				<div>${subtable(leftLabel,  d.left_rows)}</div>
				<div>${subtable(rightLabel, d.right_rows)}</div>
			</div>`;
	} else {
		// Fallback: render all rows in one table
		const body = d.rows.map(r =>
			`<tr><td>${r.attr}</td><td>${r.val}</td><td>${r.count}</td></tr>`
		).join("");
		mainHTML = `<div class="section-header">Attributes</div>
			<table>
				<tr><th>Attr</th><th>Value</th><th>Count</th></tr>
				${body}
			</table>`;
	}
	const otherHTML = hasOther
		? `<div class="section-header">Other</div>${subtable("", d.other_rows)}`
		: "";
	return `<div class="node-fo">
		<table><tr><th colspan="3">${d.title}</th></tr></table>
		${mainHTML}
		${otherHTML}
	</div>`;
}
