<!doctype html>

<style>
body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
#tree-container { display: inline-block; }
.link { fill: none; stroke: #9aa1a9; stroke-width: 1.5px; }
.node-box { stroke: #444; fill: #fff; rx: 8; ry: 8; filter: drop-shadow(1px 2px 2px rgba(0,0,0,0.15)); }
.node-fo table { border-collapse: collapse; font-size: 12px; margin: 4px 0; }
.node-fo th, .node-fo td { border: 1px solid #888; padding: 2px 6px; }
.node-fo th { background: #f3f5f7; font-weight: 600; }
.section-header { font-weight: 700; font-size: 13px; color: #333; margin: 8px 0 4px 0; border-bottom: 1px solid #ccc; padding-bottom: 2px; }
.side-by-side { display: flex; gap: 8px; align-items: flex-start; }
.side-by-side > div { flex: 1; min-width: 0; }
.sub-title { font-weight: 600; font-size: 11px; color: #555; margin-bottom: 2px; }
</style>

<body>
<div id="tree-container"><div id="tree"></div></div>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script>
const data = {"title": "ROOT", "content_rows": [], "content_left_rows": [], "content_right_rows": [], "context_before_rows": [], "context_after_rows": [], "context_other_rows": [], "children": [{"title": "07541ddb23", "content_rows": [], "content_left_rows": [{"attr": "Left0", "val": "CONCEPT-562294228962250_3", "count": "1.00"}, {"attr": "Left1", "val": "CONCEPT-563083639090041_8462", "count": "1.00"}, {"attr": "Left2", "val": "CONCEPT-563091243457458_8639", "count": "1.00"}, {"attr": "Left3", "val": "CONCEPT-563095981141625_8704", "count": "1.00"}, {"attr": "Left4", "val": "CONCEPT-563091243523333_8642", "count": "1.00"}, {"attr": "Left5", "val": "CONCEPT-563091243579250_8645", "count": "1.00"}, {"attr": "Left6", "val": "CONCEPT-563091243663791_8649", "count": "1.00"}, {"attr": "Left7", "val": "CONCEPT-562480937125375_4171", "count": "1.00"}, {"attr": "Left8", "val": "CONCEPT-562337167347125_952", "count": "1.00"}, {"attr": "Left9", "val": "CONCEPT-562458861567458_3743", "count": "1.00"}], "content_right_rows": [{"attr": "Right0", "val": "CONCEPT-562294228962250_3", "count": "1.00"}, {"attr": "Right1", "val": "CONCEPT-563103381279500_8787", "count": "1.00"}, {"attr": "Right2", "val": "CONCEPT-563103381121166_8777", "count": "1.00"}, {"attr": "Right3", "val": "CONCEPT-562938301533375_7805", "count": "1.00"}, {"attr": "Right4", "val": "CONCEPT-562910182653666_7731", "count": "1.00"}, {"attr": "Right5", "val": "CONCEPT-562910182690583_7734", "count": "1.00"}, {"attr": "Right6", "val": "CONCEPT-562770111426958_6720", "count": "1.00"}, {"attr": "Right7", "val": "CONCEPT-563103381199250_8783", "count": "1.00"}, {"attr": "Right8", "val": "CONCEPT-563103381223041_8785", "count": "1.00"}, {"attr": "Right9", "val": "EMPTYNULL", "count": "0.00"}], "context_before_rows": [{"attr": "CtxBefore0", "val": "EMPTYNULL", "count": "0.00"}, {"attr": "CtxBefore1", "val": "EMPTYNULL", "count": "0.00"}, {"attr": "CtxBefore2", "val": "EMPTYNULL", "count": "0.00"}], "context_after_rows": [{"attr": "CtxAfter0", "val": "EMPTYNULL", "count": "0.00"}, {"attr": "CtxAfter1", "val": "EMPTYNULL", "count": "0.00"}, {"attr": "CtxAfter2", "val": "EMPTYNULL", "count": "0.00"}], "context_other_rows": [{"attr": "Complexity", "val": "C3", "count": "1.00"}, {"attr": "ContentRef", "val": "CONCEPT-563103434193500_8823", "count": "0.50"}, {"attr": "", "val": "CONCEPT-563096011771916_8743", "count": "0.25"}, {"attr": "", "val": "CONCEPT-563103434130958_8820", "count": "0.12"}, {"attr": "", "val": "CONCEPT-562807645082416_7233", "count": "0.06"}, {"attr": "", "val": "CONCEPT-562507486825125_4702", "count": "0.03"}], "children": [{"title": "957d793470", "content_rows": [{"attr": "Word", "val": "a", "count": "1.00"}], "content_left_rows": [], "content_right_rows": [], "context_before_rows": [{"attr": "CtxBefore0", "val": "EMPTYNULL", "count": "0.50"}, {"attr": "CtxBefore1", "val": "EMPTYNULL", "count": "0.25"}, {"attr": "CtxBefore2", "val": "EMPTYNULL", "count": "0.12"}], "context_after_rows": [{"attr": "CtxAfter0", "val": "cat", "count": "0.50"}, {"attr": "CtxAfter1", "val": "admired", "count": "0.25"}, {"attr": "CtxAfter2", "val": "EMPTYNULL", "count": "0.12"}], "context_other_rows": [{"attr": "Complexity", "val": "C1", "count": "1.00"}, {"attr": "ContentRef", "val": "a", "count": "1.00"}], "children": []}, {"title": "6d62e5eb68", "content_rows": [], "content_left_rows": [{"attr": "Left0", "val": "CONCEPT-562294228962250_3", "count": "1.00"}, {"attr": "Left1", "val": "CONCEPT-563103381279500_8787", "count": "1.00"}, {"attr": "Left2", "val": "CONCEPT-563103381121166_8777", "count": "1.00"}, {"attr": "Left3", "val": "CONCEPT-562938301533375_7805", "count": "1.00"}, {"attr": "Left4", "val": "CONCEPT-563103381468291_8793", "count": "1.00"}, {"attr": "Left5", "val": "CONCEPT-563103381519333_8797", "count": "1.00"}, {"attr": "Left6", "val": "CONCEPT-562357281073000_1508", "count": "1.00"}, {"attr": "Left7", "val": "CONCEPT-563091248098125_8667", "count": "1.00"}, {"attr": "Left8", "val": "CONCEPT-563103381576458_8802", "count": "1.00"}, {"attr": "Left9", "val": "CONCEPT-563103381579666_8803", "count": "1.00"}], "content_right_rows": [{"attr": "Right0", "val": "CONCEPT-562294228962250_3", "count": "1.00"}, {"attr": "Right1", "val": "CONCEPT-563103381279500_8787", "count": "1.00"}, {"attr": "Right2", "val": "CONCEPT-563103385719708_8807", "count": "1.00"}, {"attr": "Right3", "val": "CONCEPT-563054040961125_8358", "count": "1.00"}, {"attr": "Right4", "val": "CONCEPT-562304292105583_113", "count": "1.00"}, {"attr": "Right5", "val": "CONCEPT-562359875625750_1613", "count": "1.00"}, {"attr": "Right6", "val": "CONCEPT-562357281176333_1516", "count": "1.00"}, {"attr": "Right7", "val": "CONCEPT-562357281192750_1518", "count": "1.00"}, {"attr": "Right8", "val": "CONCEPT-562412539338000_2746", "count": "1.00"}, {"attr": "Right9", "val": "CONCEPT-563103385833125_8815", "count": "1.00"}], "context_before_rows": [{"attr": "CtxBefore0", "val": "a", "count": "0.50"}, {"attr": "CtxBefore1", "val": "EMPTYNULL", "count": "0.00"}, {"attr": "CtxBefore2", "val": "EMPTYNULL", "count": "0.00"}], "context_after_rows": [{"attr": "CtxAfter0", "val": "EMPTYNULL", "count": "0.00"}, {"attr": "CtxAfter1", "val": "EMPTYNULL", "count": "0.00"}, {"attr": "CtxAfter2", "val": "EMPTYNULL", "count": "0.00"}], "context_other_rows": [{"attr": "Complexity", "val": "C2", "count": "1.00"}, {"attr": "ContentRef", "val": "CONCEPT-563103434417083_8831", "count": "0.50"}, {"attr": "", "val": "CONCEPT-563103434408625_8830", "count": "0.25"}, {"attr": "", "val": "CONCEPT-563103434376000_8828", "count": "0.12"}, {"attr": "", "val": "CONCEPT-562681912791250_6417", "count": "0.06"}, {"attr": "", "val": "CONCEPT-562807645082416_7233", "count": "0.03"}, {"attr": "", "val": "CONCEPT-562507486825125_4702", "count": "0.02"}], "children": [{"title": "252b25d986", "content_rows": [{"attr": "Word", "val": "cat", "count": "1.00"}], "content_left_rows": [], "content_right_rows": [], "context_before_rows": [{"attr": "CtxBefore0", "val": "a", "count": "0.50"}, {"attr": "CtxBefore1", "val": "EMPTYNULL", "count": "0.25"}, {"attr": "CtxBefore2", "val": "EMPTYNULL", "count": "0.12"}], "context_after_rows": [{"attr": "CtxAfter0", "val": "admired", "count": "0.50"}, {"attr": "CtxAfter1", "val": "EMPTYNULL", "count": "0.25"}, {"attr": "CtxAfter2", "val": "EMPTYNULL", "count": "0.12"}], "context_other_rows": [{"attr": "Complexity", "val": "C1", "count": "1.00"}, {"attr": "ContentRef", "val": "cat", "count": "1.00"}], "children": []}, {"title": "2c39d9eb4b", "content_rows": [{"attr": "Word", "val": "admired", "count": "1.00"}], "content_left_rows": [], "content_right_rows": [], "context_before_rows": [{"attr": "CtxBefore0", "val": "cat", "count": "0.50"}, {"attr": "CtxBefore1", "val": "a", "count": "0.25"}, {"attr": "CtxBefore2", "val": "EMPTYNULL", "count": "0.12"}], "context_after_rows": [{"attr": "CtxAfter0", "val": "EMPTYNULL", "count": "0.50"}, {"attr": "CtxAfter1", "val": "EMPTYNULL", "count": "0.25"}, {"attr": "CtxAfter2", "val": "EMPTYNULL", "count": "0.12"}], "context_other_rows": [{"attr": "Complexity", "val": "C1", "count": "1.00"}, {"attr": "ContentRef", "val": "admired", "count": "1.00"}], "children": []}]}]}]};
const nodeW=600, nodeH=130, hGap=80, vGap=150;

const root = d3.hierarchy(data);
const layout = d3.tree()
  .nodeSize([nodeW+hGap, nodeH+vGap])
  .separation((a,b) => a.parent===b.parent ? 1.0 : 1.4);
layout(root);

const svg = d3.select("#tree").append("svg").attr("width",1).attr("height",1);
const g = svg.append("g");

const linkGen = d3.linkVertical().x(d=>d.x).y(d=>d.y);
const link = g.selectAll("path.link").data(root.links()).join("path")
  .attr("class","link").attr("d",linkGen);

const node = g.selectAll("g.node").data(root.descendants()).join("g")
  .attr("transform", d=>`translate(${d.x},${d.y})`);

node.append("rect").attr("class","node-box")
  .attr("x",-nodeW/2).attr("y",0).attr("width",nodeW).attr("height",nodeH);

node.append("foreignObject").attr("class","node-fo")
  .attr("x",-nodeW/2+6).attr("y",6).attr("width",nodeW-12).attr("height",1000)
  .html(d => nodeHTML(d.data));

// measure actual content heights
node.selectAll("foreignObject").each(function(d){
  const fo=d3.select(this), div=fo.select("div").node();
  const h=div.getBoundingClientRect().height+12;
  d._nodeHeight = h;
  fo.attr("height",h);
  d3.select(this.parentNode).select("rect").attr("height",h+12);
});

// compute per-depth max height and reposition rows
const depthMaxHeight = new Map();
root.each(d => {
  const h = d._nodeHeight || nodeH;
  const existing = depthMaxHeight.get(d.depth) || 0;
  if (h > existing) depthMaxHeight.set(d.depth, h);
});
const maxDepth = Math.max(...Array.from(depthMaxHeight.keys()));
const depthOffsets = [];
for (let i = 0; i <= maxDepth; i++) {
  const prev = i === 0 ? 0 : depthOffsets[i-1] + (depthMaxHeight.get(i-1)||nodeH) + vGap;
  depthOffsets.push(prev);
}
root.each(d => { d.y = depthOffsets[d.depth]; });
node.attr("transform", d => `translate(${d.x},${d.y})`);
link.attr("d", linkGen);

// fit viewBox
let x0=Infinity, x1=-Infinity, y0=Infinity, y1=-Infinity;
root.each(d => {
  const halfW = nodeW/2, h = d._nodeHeight || nodeH;
  if (d.x-halfW-30 < x0) x0 = d.x-halfW-30;
  if (d.x+halfW+30 > x1) x1 = d.x+halfW+30;
  if (d.y-30 < y0) y0 = d.y-30;
  if (d.y+h+30 > y1) y1 = d.y+h+30;
});
const width=x1-x0, height=y1-y0;
svg.attr("width",width).attr("height",height)
  .attr("viewBox",[x0,y0,width,height].join(" "));

function threeColTable(title, rows) {
  if (!rows || rows.length === 0) return "";
  const body = rows.map(r =>
    `<tr><td>${r.attr}</td><td>${r.val}</td><td>${r.count}</td></tr>`
  ).join("");
  return `<div class="sub-title">${title}</div>
    <table>
      <tr><th>Attr</th><th>Value</th><th>Count</th></tr>
      ${body}
    </table>`;
}

function nodeHTML(d){
  // --- Content section ---
  let contentHTML = "";
  const hasLeft = d.content_left_rows && d.content_left_rows.length > 0;
  const hasRight = d.content_right_rows && d.content_right_rows.length > 0;
  const hasSingle = d.content_rows && d.content_rows.length > 0;

  if (hasLeft || hasRight) {
    // Composite node: left and right side by side
    contentHTML = `<div class="section-header">Content</div>
      <div class="side-by-side">
        <div>${threeColTable("Left", d.content_left_rows)}</div>
        <div>${threeColTable("Right", d.content_right_rows)}</div>
      </div>`;
  } else if (hasSingle) {
    // Primitive node: single content table
    contentHTML = `<div class="section-header">Content</div>${threeColTable("", d.content_rows)}`;
  }

  // --- Context section ---
  let contextHTML = "";
  const hasBefore = d.context_before_rows && d.context_before_rows.length > 0;
  const hasAfter = d.context_after_rows && d.context_after_rows.length > 0;
  const hasOther = d.context_other_rows && d.context_other_rows.length > 0;

  if (hasBefore || hasAfter || hasOther) {
    let ctxInner = "";
    if (hasBefore || hasAfter) {
      ctxInner += `<div class="side-by-side">
        <div>${threeColTable("Before", d.context_before_rows)}</div>
        <div>${threeColTable("After", d.context_after_rows)}</div>
      </div>`;
    }
    if (hasOther) {
      ctxInner += threeColTable("Other", d.context_other_rows);
    }
    contextHTML = `<div class="section-header">Context</div>${ctxInner}`;
  }

  return `<div class="node-fo">
    <table><tr><th colspan="3">${d.title}</th></tr></table>
    ${contentHTML}
    ${contextHTML}
  </div>`;
}
