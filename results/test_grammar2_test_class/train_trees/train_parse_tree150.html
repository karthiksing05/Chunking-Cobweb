<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<title>Parse Tree (Multi-Hierarchy)</title>
<style>
body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
#tree-container { display: inline-block; }
.link { fill: none; stroke: #9aa1a9; stroke-width: 1.5px; }
.node-box { stroke: #444; fill: #fff; rx: 8; ry: 8; filter: drop-shadow(1px 2px 2px rgba(0,0,0,0.15)); }
.node-fo table { border-collapse: collapse; font-size: 12px; margin: 4px 0; }
.node-fo th, .node-fo td { border: 1px solid #888; padding: 2px 6px; }
.node-fo th { background: #f3f5f7; font-weight: 600; }
.section-header { font-weight: 700; font-size: 13px; color: #333; margin: 8px 0 4px 0; border-bottom: 1px solid #ccc; padding-bottom: 2px; }
.side-by-side { display: flex; gap: 8px; align-items: flex-start; }
.side-by-side > div { flex: 1; min-width: 0; }
.sub-title { font-weight: 600; font-size: 11px; color: #555; margin-bottom: 2px; }
</style>
</head>
<body>
<div id="tree-container"><div id="tree"></div></div>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script>
const data = {"title": "ROOT", "content_rows": [], "content_left_rows": [], "content_right_rows": [], "context_before_rows": [], "context_after_rows": [], "context_other_rows": [], "children": [{"title": "e6a9e982bd", "content_rows": [], "content_left_rows": [{"attr": "Left0", "val": "CONCEPT-566096484441625_3", "count": "1.00"}, {"attr": "Left1", "val": "CONCEPT-566560626291291_6604", "count": "1.00"}, {"attr": "Left2", "val": "CONCEPT-566547792706000_6427", "count": "1.00"}, {"attr": "Left3", "val": "CONCEPT-566514754837291_6141", "count": "1.00"}, {"attr": "Left4", "val": "CONCEPT-566560623964666_6594", "count": "1.00"}, {"attr": "Left5", "val": "CONCEPT-566554456480750_6514", "count": "1.00"}, {"attr": "Left6", "val": "CONCEPT-566113950114833_269", "count": "1.00"}, {"attr": "Left7", "val": "CONCEPT-566135166989916_779", "count": "1.00"}, {"attr": "Left8", "val": "CONCEPT-566172972079083_1794", "count": "1.00"}, {"attr": "Left9", "val": "CONCEPT-566560624061833_6601", "count": "1.00"}], "content_right_rows": [{"attr": "Right0", "val": "CONCEPT-566096484441625_3", "count": "1.00"}, {"attr": "Right1", "val": "CONCEPT-566560626291291_6604", "count": "1.00"}, {"attr": "Right2", "val": "CONCEPT-566504523793250_6004", "count": "1.00"}, {"attr": "Right3", "val": "CONCEPT-566560626338750_6607", "count": "1.00"}, {"attr": "Right4", "val": "CONCEPT-566560626386708_6611", "count": "1.00"}, {"attr": "Right5", "val": "CONCEPT-566560626420416_6614", "count": "1.00"}, {"attr": "Right6", "val": "CONCEPT-566560626452500_6617", "count": "1.00"}, {"attr": "Right7", "val": "CONCEPT-566560626484208_6620", "count": "1.00"}, {"attr": "Right8", "val": "CONCEPT-566560626498791_6622", "count": "1.00"}, {"attr": "Right9", "val": "CONCEPT-566560626502125_6623", "count": "1.00"}], "context_before_rows": [{"attr": "CtxBefore0", "val": "EMPTYNULL", "count": "0.00"}, {"attr": "CtxBefore1", "val": "EMPTYNULL", "count": "0.00"}, {"attr": "CtxBefore2", "val": "EMPTYNULL", "count": "0.00"}], "context_after_rows": [{"attr": "CtxAfter0", "val": "EMPTYNULL", "count": "0.00"}, {"attr": "CtxAfter1", "val": "EMPTYNULL", "count": "0.00"}, {"attr": "CtxAfter2", "val": "EMPTYNULL", "count": "0.00"}], "context_other_rows": [{"attr": "Complexity", "val": "C3", "count": "1.00"}, {"attr": "ContentRef", "val": "CONCEPT-566560641178000_6655", "count": "0.50"}, {"attr": "", "val": "CONCEPT-566352944819375_4634", "count": "0.25"}, {"attr": "", "val": "CONCEPT-566352944787000_4632", "count": "0.12"}, {"attr": "", "val": "CONCEPT-566525515353500_6261", "count": "0.06"}, {"attr": "", "val": "CONCEPT-566477535273666_5772", "count": "0.03"}, {"attr": "", "val": "CONCEPT-566224292905416_2952", "count": "0.02"}], "children": [{"title": "adc23d6841", "content_rows": [{"attr": "Word", "val": "the", "count": "1.00"}], "content_left_rows": [], "content_right_rows": [], "context_before_rows": [{"attr": "CtxBefore0", "val": "EMPTYNULL", "count": "0.50"}, {"attr": "CtxBefore1", "val": "EMPTYNULL", "count": "0.25"}, {"attr": "CtxBefore2", "val": "EMPTYNULL", "count": "0.12"}], "context_after_rows": [{"attr": "CtxAfter0", "val": "man", "count": "0.50"}, {"attr": "CtxAfter1", "val": "chases", "count": "0.25"}, {"attr": "CtxAfter2", "val": "EMPTYNULL", "count": "0.12"}], "context_other_rows": [{"attr": "Complexity", "val": "C1", "count": "1.00"}, {"attr": "ContentRef", "val": "the", "count": "1.00"}], "children": []}, {"title": "01536e359f", "content_rows": [], "content_left_rows": [{"attr": "Left0", "val": "CONCEPT-566096484441625_3", "count": "1.00"}, {"attr": "Left1", "val": "CONCEPT-566560626291291_6604", "count": "1.00"}, {"attr": "Left2", "val": "CONCEPT-566509485088250_6077", "count": "1.00"}, {"attr": "Left3", "val": "CONCEPT-566525485237000_6225", "count": "1.00"}, {"attr": "Left4", "val": "CONCEPT-566525485280750_6228", "count": "1.00"}, {"attr": "Left5", "val": "CONCEPT-566161901848875_1547", "count": "1.00"}, {"attr": "Left6", "val": "CONCEPT-566299607052708_4013", "count": "1.00"}, {"attr": "Left7", "val": "CONCEPT-566509485169583_6084", "count": "1.00"}, {"attr": "Left8", "val": "CONCEPT-566560629180083_6635", "count": "1.00"}, {"attr": "Left9", "val": "CONCEPT-566560629193708_6636", "count": "1.00"}], "content_right_rows": [{"attr": "Right0", "val": "CONCEPT-566096484441625_3", "count": "1.00"}, {"attr": "Right1", "val": "CONCEPT-566101533277208_35", "count": "1.00"}, {"attr": "Right2", "val": "CONCEPT-566325074400625_4321", "count": "1.00"}, {"attr": "Right3", "val": "CONCEPT-566554454472916_6500", "count": "1.00"}, {"attr": "Right4", "val": "CONCEPT-566554463061375_6549", "count": "1.00"}, {"attr": "Right5", "val": "CONCEPT-566560631644250_6642", "count": "1.00"}, {"attr": "Right6", "val": "CONCEPT-566287133265208_3905", "count": "1.00"}, {"attr": "Right7", "val": "CONCEPT-566142903101208_1041", "count": "1.00"}, {"attr": "Right8", "val": "CONCEPT-566560631683833_6646", "count": "1.00"}, {"attr": "Right9", "val": "CONCEPT-566560631688166_6647", "count": "1.00"}], "context_before_rows": [{"attr": "CtxBefore0", "val": "the", "count": "0.50"}, {"attr": "CtxBefore1", "val": "EMPTYNULL", "count": "0.00"}, {"attr": "CtxBefore2", "val": "EMPTYNULL", "count": "0.00"}], "context_after_rows": [{"attr": "CtxAfter0", "val": "EMPTYNULL", "count": "0.00"}, {"attr": "CtxAfter1", "val": "EMPTYNULL", "count": "0.00"}, {"attr": "CtxAfter2", "val": "EMPTYNULL", "count": "0.00"}], "context_other_rows": [{"attr": "Complexity", "val": "C2", "count": "1.00"}, {"attr": "ContentRef", "val": "CONCEPT-566560643091750_6666", "count": "0.50"}, {"attr": "", "val": "CONCEPT-566560643084500_6665", "count": "0.25"}, {"attr": "", "val": "CONCEPT-566547809711083_6495", "count": "0.12"}, {"attr": "", "val": "CONCEPT-566547809677458_6493", "count": "0.06"}, {"attr": "", "val": "CONCEPT-566477538226041_5788", "count": "0.03"}, {"attr": "", "val": "CONCEPT-566525513016500_6252", "count": "0.02"}, {"attr": "", "val": "CONCEPT-566352944787000_4632", "count": "0.01"}], "children": [{"title": "619b511381", "content_rows": [{"attr": "Word", "val": "man", "count": "1.00"}], "content_left_rows": [], "content_right_rows": [], "context_before_rows": [{"attr": "CtxBefore0", "val": "the", "count": "0.50"}, {"attr": "CtxBefore1", "val": "EMPTYNULL", "count": "0.25"}, {"attr": "CtxBefore2", "val": "EMPTYNULL", "count": "0.12"}], "context_after_rows": [{"attr": "CtxAfter0", "val": "chases", "count": "0.50"}, {"attr": "CtxAfter1", "val": "EMPTYNULL", "count": "0.25"}, {"attr": "CtxAfter2", "val": "EMPTYNULL", "count": "0.12"}], "context_other_rows": [{"attr": "Complexity", "val": "C1", "count": "1.00"}, {"attr": "ContentRef", "val": "man", "count": "1.00"}], "children": []}, {"title": "6c5b0aba87", "content_rows": [{"attr": "Word", "val": "chases", "count": "1.00"}], "content_left_rows": [], "content_right_rows": [], "context_before_rows": [{"attr": "CtxBefore0", "val": "man", "count": "0.50"}, {"attr": "CtxBefore1", "val": "the", "count": "0.25"}, {"attr": "CtxBefore2", "val": "EMPTYNULL", "count": "0.12"}], "context_after_rows": [{"attr": "CtxAfter0", "val": "EMPTYNULL", "count": "0.50"}, {"attr": "CtxAfter1", "val": "EMPTYNULL", "count": "0.25"}, {"attr": "CtxAfter2", "val": "EMPTYNULL", "count": "0.12"}], "context_other_rows": [{"attr": "Complexity", "val": "C1", "count": "1.00"}, {"attr": "ContentRef", "val": "chases", "count": "1.00"}], "children": []}]}]}]};
const nodeW=600, nodeH=130, hGap=80, vGap=150;

const root = d3.hierarchy(data);
const layout = d3.tree()
  .nodeSize([nodeW+hGap, nodeH+vGap])
  .separation((a,b) => a.parent===b.parent ? 1.0 : 1.4);
layout(root);

const svg = d3.select("#tree").append("svg").attr("width",1).attr("height",1);
const g = svg.append("g");

const linkGen = d3.linkVertical().x(d=>d.x).y(d=>d.y);
const link = g.selectAll("path.link").data(root.links()).join("path")
  .attr("class","link").attr("d",linkGen);

const node = g.selectAll("g.node").data(root.descendants()).join("g")
  .attr("transform", d=>`translate(${d.x},${d.y})`);

node.append("rect").attr("class","node-box")
  .attr("x",-nodeW/2).attr("y",0).attr("width",nodeW).attr("height",nodeH);

node.append("foreignObject").attr("class","node-fo")
  .attr("x",-nodeW/2+6).attr("y",6).attr("width",nodeW-12).attr("height",1000)
  .html(d => nodeHTML(d.data));

// measure actual content heights
node.selectAll("foreignObject").each(function(d){
  const fo=d3.select(this), div=fo.select("div").node();
  const h=div.getBoundingClientRect().height+12;
  d._nodeHeight = h;
  fo.attr("height",h);
  d3.select(this.parentNode).select("rect").attr("height",h+12);
});

// compute per-depth max height and reposition rows
const depthMaxHeight = new Map();
root.each(d => {
  const h = d._nodeHeight || nodeH;
  const existing = depthMaxHeight.get(d.depth) || 0;
  if (h > existing) depthMaxHeight.set(d.depth, h);
});
const maxDepth = Math.max(...Array.from(depthMaxHeight.keys()));
const depthOffsets = [];
for (let i = 0; i <= maxDepth; i++) {
  const prev = i === 0 ? 0 : depthOffsets[i-1] + (depthMaxHeight.get(i-1)||nodeH) + vGap;
  depthOffsets.push(prev);
}
root.each(d => { d.y = depthOffsets[d.depth]; });
node.attr("transform", d => `translate(${d.x},${d.y})`);
link.attr("d", linkGen);

// fit viewBox
let x0=Infinity, x1=-Infinity, y0=Infinity, y1=-Infinity;
root.each(d => {
  const halfW = nodeW/2, h = d._nodeHeight || nodeH;
  if (d.x-halfW-30 < x0) x0 = d.x-halfW-30;
  if (d.x+halfW+30 > x1) x1 = d.x+halfW+30;
  if (d.y-30 < y0) y0 = d.y-30;
  if (d.y+h+30 > y1) y1 = d.y+h+30;
});
const width=x1-x0, height=y1-y0;
svg.attr("width",width).attr("height",height)
  .attr("viewBox",[x0,y0,width,height].join(" "));

function threeColTable(title, rows) {
  if (!rows || rows.length === 0) return "";
  const body = rows.map(r =>
    `<tr><td>${r.attr}</td><td>${r.val}</td><td>${r.count}</td></tr>`
  ).join("");
  return `<div class="sub-title">${title}</div>
    <table>
      <tr><th>Attr</th><th>Value</th><th>Count</th></tr>
      ${body}
    </table>`;
}

function nodeHTML(d){
  // --- Content section ---
  let contentHTML = "";
  const hasLeft = d.content_left_rows && d.content_left_rows.length > 0;
  const hasRight = d.content_right_rows && d.content_right_rows.length > 0;
  const hasSingle = d.content_rows && d.content_rows.length > 0;

  if (hasLeft || hasRight) {
    // Composite node: left and right side by side
    contentHTML = `<div class="section-header">Content</div>
      <div class="side-by-side">
        <div>${threeColTable("Left", d.content_left_rows)}</div>
        <div>${threeColTable("Right", d.content_right_rows)}</div>
      </div>`;
  } else if (hasSingle) {
    // Primitive node: single content table
    contentHTML = `<div class="section-header">Content</div>${threeColTable("", d.content_rows)}`;
  }

  // --- Context section ---
  let contextHTML = "";
  const hasBefore = d.context_before_rows && d.context_before_rows.length > 0;
  const hasAfter = d.context_after_rows && d.context_after_rows.length > 0;
  const hasOther = d.context_other_rows && d.context_other_rows.length > 0;

  if (hasBefore || hasAfter || hasOther) {
    let ctxInner = "";
    if (hasBefore || hasAfter) {
      ctxInner += `<div class="side-by-side">
        <div>${threeColTable("Before", d.context_before_rows)}</div>
        <div>${threeColTable("After", d.context_after_rows)}</div>
      </div>`;
    }
    if (hasOther) {
      ctxInner += threeColTable("Other", d.context_other_rows);
    }
    contextHTML = `<div class="section-header">Context</div>${ctxInner}`;
  }

  return `<div class="node-fo">
    <table><tr><th colspan="3">${d.title}</th></tr></table>
    ${contentHTML}
    ${contextHTML}
  </div>`;
}
