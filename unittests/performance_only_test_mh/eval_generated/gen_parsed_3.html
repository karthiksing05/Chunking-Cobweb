 "count": "1.00"}, {"attr": "CtxAfter4", "val": "EMPTYNULL", "count": "1.00"}], "context_other_rows": [{"attr": "Complexity", "val": "COMPLEXITY", "count": "1.00"}], "children": []}, {"title": "b2535ce2c5", "content_rows": [], "content_left_rows": [{"attr": "Left0", "val": "CONCEPT-4067724673970958_3", "count": "1.00"}, {"attr": "Left1", "val": "CONCEPT-4067728240617583_77", "count": "1.00"}, {"attr": "Left2", "val": "CONCEPT-4067740293992333_265", "count": "1.00"}, {"attr": "Left3", "val": "CONCEPT-4067751676979208_869", "count": "1.00"}, {"attr": "Left4", "val": "CONCEPT-4067754514216583_2020", "count": "1.00"}, {"attr": "Left5", "val": "CONCEPT-4067756477797708_2909", "count": "1.00"}, {"attr": "Left6", "val": "CONCEPT-4070639977976041_3213", "count": "1.00"}, {"attr": "Left7", "val": "CONCEPT-4070639977981500_3214", "count": "1.00"}, {"attr": "Left8", "val": "EMPTYNULL", "count": "0.00"}, {"attr": "Left9", "val": "EMPTYNULL", "count": "0.00"}], "content_right_rows": [{"attr": "Right0", "val": "CONCEPT-4067724673970958_3", "count": "1.00"}, {"attr": "Right1", "val": "CONCEPT-4067724674159583_14", "count": "1.00"}, {"attr": "Right2", "val": "CONCEPT-4067740293669125_248", "count": "1.00"}, {"attr": "Right3", "val": "CONCEPT-4067744040989291_511", "count": "1.00"}, {"attr": "Right4", "val": "CONCEPT-4070639978125666_3220", "count": "1.00"}, {"attr": "Right5", "val": "CONCEPT-4070068409747416_1866", "count": "1.00"}, {"attr": "Right6", "val": "CONCEPT-4070291679441083_2840", "count": "1.00"}, {"attr": "Right7", "val": "CONCEPT-4070639978195916_3224", "count": "1.00"}, {"attr": "Right8", "val": "CONCEPT-4070639978204125_3225", "count": "1.00"}, {"attr": "Right9", "val": "EMPTYNULL", "count": "0.00"}], "context_before_rows": [{"attr": "CtxBefore0", "val": "a", "count": "0.50"}, {"attr": "CtxBefore1", "val": "EMPTYNULL", "count": "0.00"}, {"attr": "CtxBefore2", "val": "EMPTYNULL", "count": "0.00"}, {"attr": "CtxBefore3", "val": "EMPTYNULL", "count": "0.00"}, {"attr": "CtxBefore4", "val": "EMPTYNULL", "count": "0.00"}], "context_after_rows": [{"attr": "CtxAfter0", "val": "EMPTYNULL", "count": "0.00"}, {"attr": "CtxAfter1", "val": "EMPTYNULL", "count": "0.00"}, {"attr": "CtxAfter2", "val": "EMPTYNULL", "count": "0.00"}, {"attr": "CtxAfter3", "val": "EMPTYNULL", "count": "0.00"}, {"attr": "CtxAfter4", "val": "EMPTYNULL", "count": "0.00"}], "context_other_rows": [{"attr": "Complexity", "val": "COMPLEXITY", "count": "2.00"}], "children": [{"title": "d06f4d8bb2", "content_rows": [{"attr": "Word", "val": "dog", "count": "1.00"}], "content_left_rows": [], "content_right_rows": [], "context_before_rows": [{"attr": "CtxBefore0", "val": "a", "count": "0.50"}, {"attr": "CtxBefore1", "val": "EMPTYNULL", "count": "1.00"}, {"attr": "CtxBefore2", "val": "EMPTYNULL", "count": "1.00"}, {"attr": "CtxBefore3", "val": "EMPTYNULL", "count": "1.00"}, {"attr": "CtxBefore4", "val": "EMPTYNULL", "count": "1.00"}], "context_after_rows": [{"attr": "CtxAfter0", "val": "liked", "count": "0.50"}, {"attr": "CtxAfter1", "val": "EMPTYNULL", "count": "1.00"}, {"attr": "CtxAfter2", "val": "EMPTYNULL", "count": "1.00"}, {"attr": "CtxAfter3", "val": "EMPTYNULL", "count": "1.00"}, {"attr": "CtxAfter4", "val": "EMPTYNULL", "count": "1.00"}], "context_other_rows": [{"attr": "Complexity", "val": "COMPLEXITY", "count": "1.00"}], "children": []}, {"title": "fbf5b56da0", "content_rows": [{"attr": "Word", "val": "liked", "count": "1.00"}], "content_left_rows": [], "content_right_rows": [], "context_before_rows": [{"attr": "CtxBefore0", "val": "dog", "count": "0.50"}, {"attr": "CtxBefore1", "val": "a", "count": "0.25"}, {"attr": "CtxBefore2", "val": "EMPTYNULL", "count": "1.00"}, {"attr": "CtxBefore3", "val": "EMPTYNULL", "count": "1.00"}, {"attr": "CtxBefore4", "val": "EMPTYNULL", "count": "1.00"}], "context_after_rows": [{"attr": "CtxAfter0", "val": "EMPTYNULL", "count": "1.00"}, {"attr": "CtxAfter1", "val": "EMPTYNULL", "count": "1.00"}, {"attr": "CtxAfter2", "val": "EMPTYNULL", "count": "1.00"}, {"attr": "CtxAfter3", "val": "EMPTYNULL", "count": "1.00"}, {"attr": "CtxAfter4", "val": "EMPTYNULL", "count": "1.00"}], "context_other_rows": [{"attr": "Complexity", "val": "COMPLEXITY", "count": "1.00"}], "children": []}]}]}]};
const nodeW=600, nodeH=130, hGap=80, vGap=150;

const root = d3.hierarchy(data);
const layout = d3.tree()
  .nodeSize([nodeW+hGap, nodeH+vGap])
  .separation((a,b) => a.parent===b.parent ? 1.0 : 1.4);
layout(root);

const svg = d3.select("#tree").append("svg").attr("width",1).attr("height",1);
const g = svg.append("g");

const linkGen = d3.linkVertical().x(d=>d.x).y(d=>d.y);
const link = g.selectAll("path.link").data(root.links()).join("path")
  .attr("class","link").attr("d",linkGen);

const node = g.selectAll("g.node").data(root.descendants()).join("g")
  .attr("transform", d=>`translate(${d.x},${d.y})`);

node.append("rect").attr("class","node-box")
  .attr("x",-nodeW/2).attr("y",0).attr("width",nodeW).attr("height",nodeH);

node.append("foreignObject").attr("class","node-fo")
  .attr("x",-nodeW/2+6).attr("y",6).attr("width",nodeW-12).attr("height",1000)
  .html(d => nodeHTML(d.data));

// measure actual content heights
node.selectAll("foreignObject").each(function(d){
  const fo=d3.select(this), div=fo.select("div").node();
  const h=div.getBoundingClientRect().height+12;
  d._nodeHeight = h;
  fo.attr("height",h);
  d3.select(this.parentNode).select("rect").attr("height",h+12);
});

// compute per-depth max height and reposition rows
const depthMaxHeight = new Map();
root.each(d => {
  const h = d._nodeHeight || nodeH;
  const existing = depthMaxHeight.get(d.depth) || 0;
  if (h > existing) depthMaxHeight.set(d.depth, h);
});
const maxDepth = Math.max(...Array.from(depthMaxHeight.keys()));
const depthOffsets = [];
for (let i = 0; i <= maxDepth; i++) {
  const prev = i === 0 ? 0 : depthOffsets[i-1] + (depthMaxHeight.get(i-1)||nodeH) + vGap;
  depthOffsets.push(prev);
}
root.each(d => { d.y = depthOffsets[d.depth]; });
node.attr("transform", d => `translate(${d.x},${d.y})`);
link.attr("d", linkGen);

// fit viewBox
let x0=Infinity, x1=-Infinity, y0=Infinity, y1=-Infinity;
root.each(d => {
  const halfW = nodeW/2, h = d._nodeHeight || nodeH;
  if (d.x-halfW-30 < x0) x0 = d.x-halfW-30;
  if (d.x+halfW+30 > x1) x1 = d.x+halfW+30;
  if (d.y-30 < y0) y0 = d.y-30;
  if (d.y+h+30 > y1) y1 = d.y+h+30;
});
const width=x1-x0, height=y1-y0;
svg.attr("width",width).attr("height",height)
  .attr("viewBox",[x0,y0,width,height].join(" "));

function threeColTable(title, rows) {
  if (!rows || rows.length === 0) return "";
  const body = rows.map(r =>
    `<tr><td>${r.attr}</td><td>${r.val}</td><td>${r.count}</td></tr>`
  ).join("");
  return `<div class="sub-title">${title}</div>
    <table>
      <tr><th>Attr</th><th>Value</th><th>Count</th></tr>
      ${body}
    </table>`;
}

function nodeHTML(d){
  // --- Content section ---
  let contentHTML = "";
  const hasLeft = d.content_left_rows && d.content_left_rows.length > 0;
  const hasRight = d.content_right_rows && d.content_right_rows.length > 0;
  const hasSingle = d.content_rows && d.content_rows.length > 0;

  if (hasLeft || hasRight) {
    // Composite node: left and right side by side
    contentHTML = `<div class="section-header">Content</div>
      <div class="side-by-side">
        <div>${threeColTable("Left", d.content_left_rows)}</div>
        <div>${threeColTable("Right", d.content_right_rows)}</div>
      </div>`;
  } else if (hasSingle) {
    // Primitive node: single content table
    contentHTML = `<div class="section-header">Content</div>${threeColTable("", d.content_rows)}`;
  }

  // --- Context section ---
  let contextHTML = "";
  const hasBefore = d.context_before_rows && d.context_before_rows.length > 0;
  const hasAfter = d.context_after_rows && d.context_after_rows.length > 0;
  const hasOther = d.context_other_rows && d.context_other_rows.length > 0;

  if (hasBefore || hasAfter || hasOther) {
    let ctxInner = "";
    if (hasBefore || hasAfter) {
      ctxInner += `<div class="side-by-side">
        <div>${threeColTable("Before", d.context_before_rows)}</div>
        <div>${threeColTable("After", d.context_after_rows)}</div>
      </div>`;
    }
    if (hasOther) {
      ctxInner += threeColTable("Other", d.context_other_rows);
    }
    contextHTML = `<div class="section-header">Context</div>${ctxInner}`;
  }

  return `<div class="node-fo">
    <table><tr><th colspan="3">${d.title}</th></tr></table>
    ${contentHTML}
    ${contextHTML}
  </div>`;
}
