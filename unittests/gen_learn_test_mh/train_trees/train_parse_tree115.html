<!doctype html>

<style>

#tree-container { display: inline-block; }
.link { fill: none; stroke: #9aa1a9; stroke-width: 1.5px; }
.node-box { stroke: #444; fill: #fff; rx: 8; ry: 8; filter: drop-shadow(1px 2px 2px rgba(0,0,0,0.15)); }
.node-fo table { border-collapse: collapse; font-size: 12px; margin: 4px 0; }
.node-fo th, .node-fo td { border: 1px solid #888; padding: 2px 6px; }
.node-fo th { background: #f3f5f7; font-weight: 600; }
.section-header { font-weight: 700; font-size: 13px; color: #333; margin: 8px 0 4px 0; border-bottom: 1px solid #ccc; padding-bottom: 2px; }
.side-by-side { display: flex; gap: 8px; align-items: flex-start; }
.side-by-side > div { flex: 1; min-width: 0; }
.sub-title { font-weight: 600; font-size: 11px; color: #555; margin-bottom: 2px; }

<body>

<script>

t_after_rows": [{"attr": "CtxAfter0", "val": "found", "count": "0.50"}, {"attr": "CtxAfter1", "val": "EMPTYNULL", "count": "0.00"}, {"attr": "CtxAfter2", "val": "EMPTYNULL", "count": "0.00"}], "context_other_rows": [{"attr": "Complexity", "val": "C3", "count": "1.00"}, {"attr": "ContentRef", "val": "CONCEPT-687710545484708_6148", "count": "0.50"}, {"attr": "", "val": "CONCEPT-687710545474458_6147", "count": "0.25"}, {"attr": "", "val": "CONCEPT-687610391535083_5239", "count": "0.12"}, {"attr": "", "val": "CONCEPT-687664789695916_5764", "count": "0.06"}, {"attr": "", "val": "CONCEPT-687652094656500_5646", "count": "0.03"}, {"attr": "", "val": "CONCEPT-687556041326500_4677", "count": "0.02"}], "children": [{"title": "a6d86f2489", "content_rows": [{"attr": "Word", "val": "the", "count": "1.00"}], "content_left_rows": [], "content_right_rows": [], "context_before_rows": [{"attr": "CtxBefore0", "val": "EMPTYNULL", "count": "0.50"}, {"attr": "CtxBefore1", "val": "EMPTYNULL", "count": "0.25"}, {"attr": "CtxBefore2", "val": "EMPTYNULL", "count": "0.12"}], "context_after_rows": [{"attr": "CtxAfter0", "val": "small", "count": "0.50"}, {"attr": "CtxAfter1", "val": "dog", "count": "0.25"}, {"attr": "CtxAfter2", "val": "found", "count": "0.12"}], "context_other_rows": [{"attr": "Complexity", "val": "C1", "count": "1.00"}, {"attr": "ContentRef", "val": "the", "count": "1.00"}], "children": []}, {"title": "82c5b638b3", "content_rows": [], "content_left_rows": [{"attr": "Left0", "val": "CONCEPT-687345735926708_3", "count": "1.00"}, {"attr": "Left1", "val": "CONCEPT-687674819725375_5890", "count": "1.00"}, {"attr": "Left2", "val": "CONCEPT-687674818583250_5848", "count": "1.00"}, {"attr": "Left3", "val": "CONCEPT-687674814164125_5813", "count": "1.00"}, {"attr": "Left4", "val": "CONCEPT-687664762665416_5670", "count": "1.00"}, {"attr": "Left5", "val": "CONCEPT-687431972451166_1967", "count": "1.00"}, {"attr": "Left6", "val": "CONCEPT-687550876106583_4571", "count": "1.00"}, {"attr": "Left7", "val": "CONCEPT-687620580782791_5267", "count": "1.00"}, {"attr": "Left8", "val": "CONCEPT-687710540288916_6117", "count": "1.00"}, {"attr": "Left9", "val": "CONCEPT-687710540307166_6119", "count": "1.00"}], "content_right_rows": [{"attr": "Right0", "val": "CONCEPT-687345735926708_3", "count": "1.00"}, {"attr": "Right1", "val": "CONCEPT-687674819725375_5890", "count": "1.00"}, {"attr": "Right2", "val": "CONCEPT-687440207444750_2131", "count": "1.00"}, {"attr": "Right3", "val": "CONCEPT-687351038615416_42", "count": "1.00"}, {"attr": "Right4", "val": "CONCEPT-687364913499041_315", "count": "1.00"}, {"attr": "Right5", "val": "CONCEPT-687431972597291_1977", "count": "1.00"}, {"attr": "Right6", "val": "CONCEPT-687710540958625_6127", "count": "1.00"}, {"attr": "Right7", "val": "CONCEPT-687443404648541_2259", "count": "1.00"}, {"attr": "Right8", "val": "CONCEPT-687710540985625_6130", "count": "1.00"}, {"attr": "Right9", "val": "CONCEPT-687710540989375_6131", "count": "1.00"}], "context_before_rows": [{"attr": "CtxBefore0", "val": "the", "count": "0.50"}, {"attr": "CtxBefore1", "val": "EMPTYNULL", "count": "0.00"}, {"attr": "CtxBefore2", "val": "EMPTYNULL", "count": "0.00"}], "context_after_rows": [{"attr": "CtxAfter0", "val": "found", "count": "0.50"}, {"attr": "CtxAfter1", "val": "EMPTYNULL", "count": "0.00"}, {"attr": "CtxAfter2", "val": "EMPTYNULL", "count": "0.00"}], "context_other_rows": [{"attr": "Complexity", "val": "C2", "count": "1.00"}, {"attr": "ContentRef", "val": "CONCEPT-687710547448708_6156", "count": "0.50"}, {"attr": "", "val": "CONCEPT-687710547441458_6155", "count": "0.25"}, {"attr": "", "val": "CONCEPT-687627195961041_5428", "count": "0.12"}, {"attr": "", "val": "CONCEPT-687699792243833_6041", "count": "0.06"}, {"attr": "", "val": "CONCEPT-687699792158958_6038", "count": "0.03"}, {"attr": "", "val": "CONCEPT-687620585404583_5365", "count": "0.02"}, {"attr": "", "val": "CONCEPT-687556041326500_4677", "count": "0.01"}], "children": [{"title": "9d9c72cc61", "content_rows": [{"attr": "Word", "val": "small", "count": "1.00"}], "content_left_rows": [], "content_right_rows": [], "context_before_rows": [{"attr": "CtxBefore0", "val": "the", "count": "0.50"}, {"attr": "CtxBefore1", "val": "EMPTYNULL", "count": "0.25"}, {"attr": "CtxBefore2", "val": "EMPTYNULL", "count": "0.12"}], "context_after_rows": [{"attr": "CtxAfter0", "val": "dog", "count": "0.50"}, {"attr": "CtxAfter1", "val": "found", "count": "0.25"}, {"attr": "CtxAfter2", "val": "EMPTYNULL", "count": "0.12"}], "context_other_rows": [{"attr": "Complexity", "val": "C1", "count": "1.00"}, {"attr": "ContentRef", "val": "small", "count": "1.00"}], "children": []}, {"title": "6af3c8e48a", "content_rows": [{"attr": "Word", "val": "dog", "count": "1.00"}], "content_left_rows": [], "content_right_rows": [], "context_before_rows": [{"attr": "CtxBefore0", "val": "small", "count": "0.50"}, {"attr": "CtxBefore1", "val": "the", "count": "0.25"}, {"attr": "CtxBefore2", "val": "EMPTYNULL", "count": "0.12"}], "context_after_rows": [{"attr": "CtxAfter0", "val": "found", "count": "0.50"}, {"attr": "CtxAfter1", "val": "EMPTYNULL", "count": "0.25"}, {"attr": "CtxAfter2", "val": "EMPTYNULL", "count": "0.12"}], "context_other_rows": [{"attr": "Complexity", "val": "C1", "count": "1.00"}, {"attr": "ContentRef", "val": "dog", "count": "1.00"}], "children": []}]}]}, {"title": "a941260d95", "content_rows": [{"attr": "Word", "val": "found", "count": "1.00"}], "content_left_rows": [], "content_right_rows": [], "context_before_rows": [{"attr": "CtxBefore0", "val": "dog", "count": "0.50"}, {"attr": "CtxBefore1", "val": "small", "count": "0.25"}, {"attr": "CtxBefore2", "val": "the", "count": "0.12"}], "context_after_rows": [{"attr": "CtxAfter0", "val": "EMPTYNULL", "count": "0.50"}, {"attr": "CtxAfter1", "val": "EMPTYNULL", "count": "0.25"}, {"attr": "CtxAfter2", "val": "EMPTYNULL", "count": "0.12"}], "context_other_rows": [{"attr": "Complexity", "val": "C1", "count": "1.00"}, {"attr": "ContentRef", "val": "found", "count": "1.00"}], "children": []}]};
const nodeW=600, nodeH=130, hGap=80, vGap=150;

const root = d3.hierarchy(data);
const layout = d3.tree()
  .nodeSize([nodeW+hGap, nodeH+vGap])
  .separation((a,b) => a.parent===b.parent ? 1.0 : 1.4);
layout(root);

const svg = d3.select("#tree").append("svg").attr("width",1).attr("height",1);
const g = svg.append("g");

const linkGen = d3.linkVertical().x(d=>d.x).y(d=>d.y);
const link = g.selectAll("path.link").data(root.links()).join("path")
  .attr("class","link").attr("d",linkGen);

const node = g.selectAll("g.node").data(root.descendants()).join("g")
  .attr("transform", d=>`translate(${d.x},${d.y})`);

node.append("rect").attr("class","node-box")
  .attr("x",-nodeW/2).attr("y",0).attr("width",nodeW).attr("height",nodeH);

node.append("foreignObject").attr("class","node-fo")
  .attr("x",-nodeW/2+6).attr("y",6).attr("width",nodeW-12).attr("height",1000)
  .html(d => nodeHTML(d.data));

// measure actual content heights
node.selectAll("foreignObject").each(function(d){
  const fo=d3.select(this), div=fo.select("div").node();
  const h=div.getBoundingClientRect().height+12;
  d._nodeHeight = h;
  fo.attr("height",h);
  d3.select(this.parentNode).select("rect").attr("height",h+12);
});

// compute per-depth max height and reposition rows
const depthMaxHeight = new Map();
root.each(d => {
  const h = d._nodeHeight || nodeH;
  const existing = depthMaxHeight.get(d.depth) || 0;
  if (h > existing) depthMaxHeight.set(d.depth, h);
});
const maxDepth = Math.max(...Array.from(depthMaxHeight.keys()));
const depthOffsets = [];
for (let i = 0; i <= maxDepth; i++) {
  const prev = i === 0 ? 0 : depthOffsets[i-1] + (depthMaxHeight.get(i-1)||nodeH) + vGap;
  depthOffsets.push(prev);
}
root.each(d => { d.y = depthOffsets[d.depth]; });
node.attr("transform", d => `translate(${d.x},${d.y})`);
link.attr("d", linkGen);

// fit viewBox
let x0=Infinity, x1=-Infinity, y0=Infinity, y1=-Infinity;
root.each(d => {
  const halfW = nodeW/2, h = d._nodeHeight || nodeH;
  if (d.x-halfW-30 < x0) x0 = d.x-halfW-30;
  if (d.x+halfW+30 > x1) x1 = d.x+halfW+30;
  if (d.y-30 < y0) y0 = d.y-30;
  if (d.y+h+30 > y1) y1 = d.y+h+30;
});
const width=x1-x0, height=y1-y0;
svg.attr("width",width).attr("height",height)
  .attr("viewBox",[x0,y0,width,height].join(" "));

function threeColTable(title, rows) {
  if (!rows || rows.length === 0) return "";
  const body = rows.map(r =>
    `<tr><td>${r.attr}</td><td>${r.val}</td><td>${r.count}</td></tr>`
  ).join("");
  return `<div class="sub-title">${title}</div>
    <table>
      <tr><th>Attr</th><th>Value</th><th>Count</th></tr>
      ${body}
    </table>`;
}

function nodeHTML(d){
  // --- Content section ---
  let contentHTML = "";
  const hasLeft = d.content_left_rows && d.content_left_rows.length > 0;
  const hasRight = d.content_right_rows && d.content_right_rows.length > 0;
  const hasSingle = d.content_rows && d.content_rows.length > 0;

  if (hasLeft || hasRight) {
    // Composite node: left and right side by side
    contentHTML = `<div class="section-header">Content</div>
      <div class="side-by-side">
        <div>${threeColTable("Left", d.content_left_rows)}</div>
        <div>${threeColTable("Right", d.content_right_rows)}</div>
      </div>`;
  } else if (hasSingle) {
    // Primitive node: single content table
    contentHTML = `<div class="section-header">Content</div>${threeColTable("", d.content_rows)}`;
  }

  // --- Context section ---
  let contextHTML = "";
  const hasBefore = d.context_before_rows && d.context_before_rows.length > 0;
  const hasAfter = d.context_after_rows && d.context_after_rows.length > 0;
  const hasOther = d.context_other_rows && d.context_other_rows.length > 0;

  if (hasBefore || hasAfter || hasOther) {
    let ctxInner = "";
    if (hasBefore || hasAfter) {
      ctxInner += `<div class="side-by-side">
        <div>${threeColTable("Before", d.context_before_rows)}</div>
        <div>${threeColTable("After", d.context_after_rows)}</div>
      </div>`;
    }
    if (hasOther) {
      ctxInner += threeColTable("Other", d.context_other_rows);
    }
    contextHTML = `<div class="section-header">Context</div>${ctxInner}`;
  }

  return `<div class="node-fo">
    <table><tr><th colspan="3">${d.title}</th></tr></table>
    ${contentHTML}
    ${contextHTML}
  </div>`;
}
