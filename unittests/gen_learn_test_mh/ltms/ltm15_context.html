svg.attr("width", width)
	.attr("height", height)
	.attr("viewBox", [x0, y0, width, height].join(" "));

function nodeHTML(d) {
	let tableRows = d.rows.map(r =>
		`<tr><td>${r.attr}</td><td>${r.val}</td><td>${r.count}</td></tr>`
	).join("");
	return `
	<div class="node-fo">
		<table>
			<tr><th colspan="3">${d.title}</th></tr>
			<tr><th>Attr</th><th>Value</th><th>Count</th></tr>
			${tableRows}
		</table>
	</div>`;
}
</script>
