}

root.each(d => { d.y = depthOffsets[d.depth]; });

node.attr("transform", d => `translate(${d.x},${d.y})`);
link.attr("d", linkGen);

let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
root.each(d => {
	const halfW = nodeW / 2;
	const h = d._nodeHeight || nodeH;
	if (d.x - halfW - 30 < x0) x0 = d.x - halfW - 30;
	if (d.x + halfW + 30 > x1) x1 = d.x + halfW + 30;
	if (d.y - 30 < y0) y0 = d.y - 30;
	if (d.y + h + 30 > y1) y1 = d.y + h + 30;
});
const width  = x1 - x0;
const height = y1 - y0;

svg.attr("width", width)
	.attr("height", height)
	.attr("viewBox", [x0, y0, width, height].join(" "));

function nodeHTML(d) {
	const attrTables = d.attributes.map(a => {
		const rows = a.rows.map(r => `<tr><td>${r.val}</td><td>${r.count}</td></tr>`).join("");
		return `<div class="section"><div class="section-title">${a.attr}</div><table><tbody>${rows}</tbody></table></div>`;
	}).join("");
	return `
	<div class="node-fo">
		<table><tr><th>${d.title}</th></tr></table>
		${attrTables}
	</div>`;
}
</script>
</body>
</html>
